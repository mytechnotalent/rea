[workspace]
resolver = "2"
members = ["crates/rea-sleigh", "crates/rea", "crates/rea-engine", "crates/rea-report", "crates/reverse-engineering", "xtask"]

[workspace.package]
version = "5.6.0"
edition = "2021"
authors = ["Kevin Thomas"]
license = "MIT"
homepage = "https://github.com/mytechnotalent/rea"
repository = "https://github.com/mytechnotalent/rea"

[workspace.dependencies]
rea-engine = { path = "crates/rea-engine" }
rea-report = { path = "crates/rea-report" }
serde_json = "1.0"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1

[profile.dev.package."*"]
opt-level = 2
